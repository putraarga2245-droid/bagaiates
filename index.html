<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD MongoDB Vercel</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 30px auto; padding: 20px; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        ul { padding-left: 20px; }
    </style>
</head>
<body>

    <h2>Aplikasi CRUD Sederhana</h2>
    
    <!-- Form Tambah Data -->
    <input type="text" id="name" placeholder="Nama Item">
    <input type="text" id="description" placeholder="Deskripsi">
    <button onclick="addItem()">Tambah Data</button>

    <h3>Daftar Data:</h3>
    <ul id="itemList"></ul>

    <script>
        // Ganti URL ini dengan link Vercel kamu setelah dideploy
        const API_URL = ""; // Contoh: "https://bagaiates.vercel.app/api/items" (kosongkan jika file html ini digabung/di-host di tempat lain, atau arahkan langsung ke domain vercelmu)

        async function fetchItems() {
            try {
                const response = await fetch('/api/items');
                const items = await response.json();
                const list = document.getElementById('itemList');
                list.innerHTML = '';
                items.forEach(item => {
                    list.innerHTML += `<li><b>${item.name}</b>: ${item.description} 
                    <button onclick="deleteItem('${item._id}')" style="width:auto; padding:2px 5px;">Hapus</button></li>`;
                });
            } catch (err) {
                console.error("Gagal memuat data", err);
            }
        }

        async function addItem() {
            const name = document.getElementById('name').value;
            const description = document.getElementById('description').value;

            await fetch('/api/items', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, description })
            });

            document.getElementById('name').value = '';
            document.getElementById('description').value = '';
            fetchItems();
        }

        async function deleteItem(id) {
            await fetch(`/api/items/${id}`, { method: 'DELETE' });
            fetchItems();
        }

        // Panggil saat halaman dibuka
        fetchItems();
    </script>
</body>
</html>
