<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD MongoDB Vercel</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 30px auto; padding: 20px; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        ul { padding-left: 20px; }
        li { margin-bottom: 8px; }
    </style>
</head>
<body>

    <h2>Aplikasi CRUD Sederhana</h2>
    
    <!-- Form Tambah Data -->
    <input type="text" id="name" placeholder="Nama Item">
    <input type="text" id="description" placeholder="Deskripsi">
    <button onclick="addItem()">Tambah Data</button>

    <h3>Daftar Data:</h3>
    <ul id="itemList"></ul>

    <script>
        async function fetchItems() {
            try {
                const response = await fetch('/api/items');
                const items = await response.json();
                const list = document.getElementById('itemList');
                list.innerHTML = '';
                
                if (Array.isArray(items) && items.length > 0) {
                    items.forEach(item => {
                        list.innerHTML += `<li><b>${item.name}</b>: ${item.description} 
                        <button onclick="deleteItem('${item._id}')" style="width:auto; padding:2px 5px; margin-left: 10px;">Hapus</button></li>`;
                    });
                } else {
                    list.innerHTML = '<li>Belum ada data.</li>';
                }
            } catch (err) {
                console.error("Gagal memuat data", err);
            }
        }

        async function addItem() {
            const name = document.getElementById('name').value;
            const description = document.getElementById('description').value;

            if (!name.trim()) {
                alert("Nama item tidak boleh kosong!");
                return;
            }

            try {
                const response = await fetch('/api/items', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, description })
                });

                if (response.ok) {
                    document.getElementById('name').value = '';
                    document.getElementById('description').value = '';
                    fetchItems();
                } else {
                    alert("Gagal menyimpan ke server!");
                }
            } catch (err) {
                alert("Terjadi kesalahan jaringan: " + err.message);
            }
        }

        async function deleteItem(id) {
            try {
                const response = await fetch(`/api/items/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    fetchItems();
                } else {
                    alert("Gagal menghapus data!");
                }
            } catch (err) {
                alert("Terjadi kesalahan jaringan: " + err.message);
            }
        }

        // Panggil saat halaman pertama kali dibuka
        fetchItems();
    </script>
</body>
</html>
